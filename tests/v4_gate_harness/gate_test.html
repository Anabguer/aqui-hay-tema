  <script src="/assets/js/v4/screen-manager.js"></script>
  <script>
    function runTest() {
      var results = [];
      function test(n, ok, d) { results.push({name:n, ok:ok, detail:d||''}); }
      var velo = document.querySelector('.aht-velo');
      test('1.1 aht-velo exists', !!velo);
      if (velo) { var cs = getComputedStyle(velo); test('1.2 position:fixed', cs.position==='fixed'); test('1.3 z-index:100', cs.zIndex==='100'); test('1.4 opacity:0', cs.opacity==='0'); test('1.5 pointer-events:none', cs.pointerEvents==='none'); }
      var allX = document.querySelectorAll('.aht-frame-close');
      test('2.1 X buttons (>=19)', allX.length >= 19);
      var xBtn = document.querySelector('.aht-frame-close');
      if (xBtn) { var xcs = getComputedStyle(xBtn); test('2.2 display:grid', xcs.display==='grid'); test('2.3 cursor:pointer', xcs.cursor==='pointer'); test('2.4 position:absolute', xcs.position==='absolute'); test('2.5 color token', xcs.color==='rgb(196, 43, 74)'); var xOk=true; allX.forEach(function(x){if(getComputedStyle(x).display!=='grid')xOk=false;}); test('2.6 X uniform', xOk); }
      var allF = document.querySelectorAll('.aht-frame');
      test('3.1 Frame (>=19)', allF.length >= 19);
      var frame = document.querySelector('.aht-frame');
      if (frame) { var fcs = getComputedStyle(frame); test('3.2 frame NOT position:fixed', fcs.position!=='fixed'); test('3.3 border-radius', fcs.borderRadius!=='0px'); test('3.4 box-shadow', fcs.boxShadow!=='none'); var fOk=true; allF.forEach(function(f){if(getComputedStyle(f).position==='fixed')fOk=false;}); test('3.5 no frame has position:fixed', fOk); }
      test('4.1 19 screens', document.querySelectorAll('.aht-screen').length === 19);
      var rs = getComputedStyle(document.documentElement);
      var toks = ['--aht-z-velo','--aht-z-frame','--aht-overlay','--aht-surface-raised','--aht-border','--aht-frame-radius','--aht-font-hand','--aht-dur','--aht-accent','--aht-close-color','--aht-close-bg','--aht-close-border','--aht-header-bg','--aht-header-mark','--aht-body-bg'];
      var miss = []; toks.forEach(function(t){if(!rs.getPropertyValue(t).trim())miss.push(t);});
      test('5.1 tokens defined', miss.length===0, miss.length?miss.join(', '):'');
      var sm = window.AHTScreenManager;
      test('6.1 SM exists', !!sm);
      if (sm) { test('6.2 open()', typeof sm.open==='function'); test('6.3 close()', typeof sm.close==='function'); test('6.4 isAnyOpen()', typeof sm.isAnyOpen==='function'); test('6.5 V4_SCREENS set', sm.V4_SCREENS instanceof Set); test('6.6 V4_SCREENS 19', sm.V4_SCREENS.size===19); }
      test('7.1 headers (>=19)', document.querySelectorAll('.aht-frame-header').length>=19);
      test('7.2 titles (>=19)', document.querySelectorAll('.aht-frame-title').length>=19);
      var v4s = Array.from(document.styleSheets).filter(function(ss){try{return(ss.href||'').includes('/v4/');}catch(e){return false;}});
      var imp=0; v4s.forEach(function(ss){try{Array.from(ss.cssRules||[]).forEach(function(r){if(r.cssText&&r.cssText.includes('!important'))imp++;});}catch(e){}});
      test('8.1 zero !important', imp===0, imp?imp+' found':'');
      var bT=document.querySelector('[data-aht-screen="buzon"] .aht-frame-tabs');
      var vT=document.querySelector('[data-aht-screen="vecinos"] .aht-frame-tabs');
      test('9.1 buzon has .aht-frame-tabs',!!bT);
      test('9.2 vecinos has .aht-frame-tabs',!!vT);
      if(bT){var bt=bT.querySelectorAll('.aht-frame-tab');test('9.3 buzon 2 tabs',bt.length===2);var ba=bT.querySelector('.is-active');test('9.4 buzon is-active',!!ba);if(ba){var bcs=getComputedStyle(ba);test('9.5 buzon active pink bg',bcs.backgroundColor==='rgb(196, 43, 74)',bcs.backgroundColor);test('9.6 buzon active white text',bcs.color==='rgb(255, 255, 255)',bcs.color);}}
      if(vT){var vt=vT.querySelectorAll('.aht-frame-tab');test('9.7 vecinos 2 tabs',vt.length===2);var va=vT.querySelector('.is-active');test('9.8 vecinos is-active',!!va);if(va){var vcs=getComputedStyle(va);test('9.9 vecinos active pink bg',vcs.backgroundColor==='rgb(196, 43, 74)',vcs.backgroundColor);test('9.10 vecinos active white text',vcs.color==='rgb(255, 255, 255)',vcs.color);}}
      test('9.11 tabs share same class names',!!bT&&!!vT&&bT.className===vT.className);
      var pass=0,fail=0; console.log('\\n=== AHT V4 Architecture Test (FASE 5) ===');
      results.forEach(function(r){var i=r.ok?'PASS':'FAIL';console.log('['+i+'] '+r.name+(r.detail?' -- '+r.detail:''));if(r.ok)pass++;else fail++;});
      console.log('--------------------------------');console.log('Total: '+(pass+fail)+' | Pass: '+pass+' | Fail: '+fail);console.log('================================\\n');
      return {pass:pass,fail:fail,results:results};
    }
  </script>
