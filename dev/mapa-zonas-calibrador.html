<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Calibrador mapa canónico v2 — 9 zonas</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font: 13px/1.35 Consolas, "Segoe UI", sans-serif;
      background: #2a2620; color: #f5f0e6;
      display: grid; grid-template-rows: auto 1fr; height: 100vh;
    }
    header {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      padding: 8px 10px; background: #1e1b17; border-bottom: 1px solid #4a4338;
    }
    header h1 { margin: 0; font-size: 14px; font-weight: 700; margin-right: 8px; }
    header button {
      background: #3d362c; color: inherit; border: 1px solid #6b6154;
      padding: 5px 10px; cursor: pointer; border-radius: 3px;
    }
    header button:hover { background: #524a3e; }
    header button.is-on { background: #7a4a2a; border-color: #c98a4a; }
    header .sep { width: 1px; height: 22px; background: #4a4338; margin: 0 4px; }
    main { display: grid; grid-template-columns: 220px 1fr 360px; min-height: 0; }
    .zonas-list { overflow: auto; padding: 10px; background: #1e1b17; border-right: 1px solid #4a4338; }
    .zonas-list h2 { margin: 0 0 8px; font-size: 13px; }
    .zona-btn {
      display: block; width: 100%; text-align: left; margin-bottom: 6px; padding: 8px 10px;
      border: 1px solid #3d362c; border-radius: 4px; background: #242018; color: inherit;
      cursor: pointer; border-left: 4px solid var(--c, #888);
    }
    .zona-btn.is-active { border-color: #c98a4a; background: #2a2418; }
    .zona-btn small { display: block; color: #9a8f7e; font-size: 10px; margin-top: 2px; }
    .viewport {
      overflow: auto; padding: 12px; background: #111;
      display: flex; justify-content: center; align-items: flex-start;
    }
    .stage-wrap { transform-origin: top center; }
    .stage {
      position: relative; width: 618px; height: 404px;
      box-shadow: 0 0 0 2px #555; user-select: none; touch-action: none;
    }
    .stage img.mapa-bg {
      position: absolute; inset: 0; width: 100%; height: 100%;
      pointer-events: none; display: block;
    }
    .zones-layer { position: absolute; inset: 0; }
    .zona-rect, .tokens-rect {
      position: absolute; min-width: 8px; min-height: 8px; cursor: move;
    }
    .zona-rect {
      border: 2px solid var(--c, #ffdc50);
      background: color-mix(in srgb, var(--c, #ffdc50) 16%, transparent);
    }
    .zona-rect:not(.is-active) { opacity: .42; }
    .zona-rect.is-active { opacity: 1; z-index: 4; box-shadow: 0 0 0 1px rgba(0,0,0,.35); }
    .tokens-rect {
      border: 2px dashed #6ec8ff;
      background: rgba(110, 200, 255, .12); z-index: 6;
    }
    .tokens-rect:not(.is-active) { opacity: .55; }
    .tokens-rect.is-active { opacity: 1; box-shadow: 0 0 0 1px rgba(110,200,255,.5); }
    .zona-rect .lbl, .tokens-rect .lbl {
      position: absolute; top: 2px; left: 4px; font-size: 10px; font-weight: 700; color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,.85); pointer-events: none;
    }
    .tokens-rect .lbl { color: #dff4ff; }
    .handle {
      position: absolute; width: 10px; height: 10px;
      background: #fff; border: 2px solid #222; border-radius: 2px; z-index: 8;
    }
    .handle.nw { top: -6px; left: -6px; cursor: nwse-resize; }
    .handle.ne { top: -6px; right: -6px; cursor: nesw-resize; }
    .handle.sw { bottom: -6px; left: -6px; cursor: nesw-resize; }
    .handle.se { bottom: -6px; right: -6px; cursor: nwse-resize; }
    .handle.n { top: -6px; left: 50%; margin-left: -5px; cursor: ns-resize; }
    .handle.s { bottom: -6px; left: 50%; margin-left: -5px; cursor: ns-resize; }
    .handle.w { left: -6px; top: 50%; margin-top: -5px; cursor: ew-resize; }
    .handle.e { right: -6px; top: 50%; margin-top: -5px; cursor: ew-resize; }
    .obras-preview {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      pointer-events: none; padding: 6%; z-index: 3;
    }
    .obras-preview img {
      max-width: 88%; max-height: 88%; width: auto; height: auto;
      object-fit: contain; opacity: .95;
    }
    .draw-preview {
      position: absolute; border: 2px dashed #fff;
      background: rgba(255,255,255,.12); pointer-events: none; z-index: 20;
    }
    aside { overflow: auto; padding: 10px; background: #242018; border-left: 1px solid #4a4338; }
    aside h2 { margin: 0 0 8px; font-size: 13px; }
    .info { color: #b8aa96; font-size: 12px; margin-bottom: 10px; }
    .layer-toggle { display: flex; gap: 6px; margin-bottom: 10px; }
    .layer-toggle button { flex: 1; padding: 6px 8px; }
    .ctrl { display: grid; grid-template-columns: 1fr; gap: 4px; margin: 5px 0; }
    .ctrl label { color: #9a8f7e; font-size: 11px; }
    .ctrl input[type=number] {
      width: 100%; padding: 4px; background: #111; color: #cfc;
      border: 1px solid #4a4338; font: inherit;
    }
    .section-title { margin: 12px 0 6px; font-size: 11px; color: #c98a4a; text-transform: uppercase; letter-spacing: .06em; }
    .row-btns { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
    .row-btns button { flex: 1 1 45%; min-width: 80px; padding: 6px; }
    .export-box { margin-top: 12px; padding-top: 10px; border-top: 1px solid #4a4338; }
    .export-box textarea {
      width: 100%; height: 220px; font: 11px/1.3 Consolas, monospace;
      background: #111; color: #cfc; border: 1px solid #4a4338; padding: 6px;
    }
    .export-box button { margin-top: 6px; width: 100%; padding: 8px; background: #3d362c; color: inherit; border: 1px solid #6b6154; cursor: pointer; }
    .hint { font-size: 11px; color: #8a8070; margin-top: 8px; line-height: 1.45; }
    #toast {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      background: #2d5a2d; padding: 8px 16px; border-radius: 4px; display: none; z-index: 99;
    }
    #toast.is-on { display: block; }
  </style>
</head>
<body>
  <header>
    <h1>Calibrador mapa canónico v2 (Mapa_2)</h1>
    <button type="button" id="btn-zoom-out">− zoom</button>
    <button type="button" id="btn-zoom-in">+ zoom</button>
    <span id="zoom-label">70%</span>
    <span class="sep"></span>
    <button type="button" id="btn-all-zones" class="is-on">Ver todas</button>
    <button type="button" id="btn-obras">Preview EN OBRAS</button>
    <span class="sep"></span>
    <button type="button" id="btn-load-server">CARGAR JSON JUEGO</button>
    <button type="button" id="btn-export">EXPORTAR JSON</button>
    <button type="button" id="btn-copy">COPIAR JSON</button>
  </header>
  <main>
    <div class="zonas-list" id="zonas-list"></div>
    <div class="viewport" id="viewport">
      <div class="stage-wrap" id="stage-wrap">
        <div class="stage" id="stage">
          <img class="mapa-bg" id="mapa-bg" src="../assets/play-v3/mapa_canonico_v2.png" alt="Mapa canónico v2" width="618" height="404"/>
          <div class="zones-layer" id="zones-layer"></div>
        </div>
      </div>
    </div>
    <aside>
      <h2 id="sel-title">Zona seleccionada</h2>
      <p class="info" id="sel-info"></p>
      <div class="layer-toggle">
        <button type="button" id="btn-layer-zona" class="is-on">Área clicable</button>
        <button type="button" id="btn-layer-tokens">Área tokens</button>
      </div>
      <div id="controls"></div>
      <div class="row-btns">
        <button type="button" id="btn-nudge-up">↑ 0.5%</button>
        <button type="button" id="btn-nudge-down">↓ 0.5%</button>
        <button type="button" id="btn-nudge-left">← 0.5%</button>
        <button type="button" id="btn-nudge-right">→ 0.5%</button>
        <button type="button" id="btn-clear-layer">Borrar capa activa</button>
      </div>
      <div class="export-box">
        <label for="export-out">Salida JSON (porcentajes del mapa)</label>
        <textarea id="export-out" readonly spellcheck="false"></textarea>
        <button type="button" id="btn-download">Descargar mapa_zonas.json</button>
        <p class="hint">
          Rutas canónicas: <code>assets/play-v3/mapa_canonico_v2.png</code> ·
          <code>assets/play-v3/overlay_en_obras.png</code><br/>
          Rectángulo sólido = zona clicable · rectángulo punteado azul = tokens/personajes.<br/>
          Clic vacío = dibujar · arrastrar = mover · asas = redimensionar.
        </p>
      </div>
    </aside>
  </main>
  <div id="toast"></div>

<script>
(function () {
  'use strict';

  var MAP_W = 618;
  var MAP_H = 404;
  var OBRAS_URL = '../assets/play-v3/overlay_en_obras.png';
  var STORAGE_KEY = 'aht_mapa_zonas_calibrador_v3_mapa2';
  var MIN_PCT = 0.5;

  var ZONAS = [
    { id: 'cafeteria', label: 'Cafetería', color: '#e8a030' },
    { id: 'biblioteca', label: 'Biblioteca', color: '#5080c0' },
    { id: 'gimnasio', label: 'Gimnasio', color: '#40a0a0' },
    { id: 'restaurante', label: 'Restaurante', color: '#d08040' },
    { id: 'parque', label: 'Parque', color: '#60a840' },
    { id: 'bar', label: 'Bar', color: '#8a5030' },
    { id: 'cine', label: 'Cine', color: '#9060a0' },
    { id: 'discoteca', label: 'Discoteca', color: '#c040a0' },
    { id: 'bingo', label: 'Bingo', color: '#b09030' }
  ];

  var state = {
    selected: 'cafeteria',
    editLayer: 'zona',
    zoom: 0.7,
    showAll: true,
    showObras: false,
    zonas: {}
  };

  var stage = document.getElementById('stage');
  var zonesLayer = document.getElementById('zones-layer');
  var stageWrap = document.getElementById('stage-wrap');
  var zonasList = document.getElementById('zonas-list');
  var controlsEl = document.getElementById('controls');
  var exportOut = document.getElementById('export-out');
  var interaction = { mode: null, layer: null, id: null, handle: null, sx: 0, sy: 0, start: null, orig: null };
  var drawPreview = null;

  function emptyRect() { return { x: 0, y: 0, w: 0, h: 0 }; }

  ZONAS.forEach(function (z) {
    state.zonas[z.id] = { x: 0, y: 0, w: 0, h: 0, tokens: emptyRect() };
  });

  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('is-on');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.classList.remove('is-on'); }, 1800);
  }

  function roundPct(n) { return Math.round(n * 100) / 100; }

  function pctToPx(r) {
    return {
      left: (r.x / 100) * MAP_W,
      top: (r.y / 100) * MAP_H,
      width: (r.w / 100) * MAP_W,
      height: (r.h / 100) * MAP_H
    };
  }

  function pxToPct(left, top, width, height) {
    return {
      x: roundPct((left / MAP_W) * 100),
      y: roundPct((top / MAP_H) * 100),
      w: roundPct((width / MAP_W) * 100),
      h: roundPct((height / MAP_H) * 100)
    };
  }

  function clampRect(p) {
    return {
      x: Math.max(0, Math.min(100 - MIN_PCT, p.x)),
      y: Math.max(0, Math.min(100 - MIN_PCT, p.y)),
      w: Math.max(0, Math.min(100 - p.x, p.w)),
      h: Math.max(0, Math.min(100 - p.y, p.h))
    };
  }

  function hasRect(r) { return r && r.w >= MIN_PCT && r.h >= MIN_PCT; }

  function zonaMeta(id) {
    for (var i = 0; i < ZONAS.length; i++) if (ZONAS[i].id === id) return ZONAS[i];
    return { id: id, label: id, color: '#888' };
  }

  function getLayerRect(id, layer) {
    var z = state.zonas[id];
    return layer === 'tokens' ? z.tokens : z;
  }

  function setLayerRect(id, layer, patch) {
    var z = state.zonas[id];
    var cur = layer === 'tokens' ? z.tokens : z;
    var next = clampRect({
      x: patch.x !== undefined ? patch.x : cur.x,
      y: patch.y !== undefined ? patch.y : cur.y,
      w: patch.w !== undefined ? patch.w : cur.w,
      h: patch.h !== undefined ? patch.h : cur.h
    });
    if (layer === 'tokens') {
      z.tokens.x = next.x; z.tokens.y = next.y; z.tokens.w = next.w; z.tokens.h = next.h;
    } else {
      z.x = next.x; z.y = next.y; z.w = next.w; z.h = next.h;
    }
    saveLocal();
    renderZones();
    renderControls();
    updateExportPreview();
    renderZonaButtons();
  }

  function clearLayerRect(id, layer) {
    setLayerRect(id, layer, emptyRect());
  }

  function saveLocal() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ zonas: state.zonas })); } catch (e) {}
  }

  function loadLocal() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      applyZonasData(JSON.parse(raw));
    } catch (e) {}
  }

  function applyZonasData(data) {
    if (!data || !data.zonas) return;
    Object.keys(data.zonas).forEach(function (id) {
      if (!state.zonas[id]) return;
      var s = data.zonas[id];
      state.zonas[id].x = s.x || 0;
      state.zonas[id].y = s.y || 0;
      state.zonas[id].w = s.w || 0;
      state.zonas[id].h = s.h || 0;
      if (s.tokens) {
        state.zonas[id].tokens = {
          x: s.tokens.x || 0, y: s.tokens.y || 0,
          w: s.tokens.w || 0, h: s.tokens.h || 0
        };
      }
    });
  }

  function loadServer() {
    return fetch('../assets/play-v3/mapa_zonas.json?v=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (data) {
        applyZonasData(data);
        toast('JSON del juego cargado');
      })
      .catch(function () { toast('No se pudo cargar mapa_zonas.json'); });
  }

  function stageScale() { return state.zoom; }

  function stagePoint(ev) {
    var rect = stage.getBoundingClientRect();
    var s = stageScale();
    return { x: (ev.clientX - rect.left) / s, y: (ev.clientY - rect.top) / s };
  }

  function appendHandles(el) {
    ['nw','n','ne','e','se','s','sw','w'].forEach(function (h) {
      var hd = document.createElement('span');
      hd.className = 'handle ' + h;
      hd.setAttribute('data-handle', h);
      el.appendChild(hd);
    });
  }

  function renderZonaButtons() {
    var html = '<h2>9 lugares</h2>';
    ZONAS.forEach(function (z) {
      var cfg = state.zonas[z.id];
      var ok = hasRect(cfg);
      var tok = hasRect(cfg.tokens);
      html += '<button type="button" class="zona-btn' + (state.selected === z.id ? ' is-active' : '') +
        '" data-z="' + z.id + '" style="--c:' + z.color + '">' + z.label +
        '<small>' + (ok ? ('zona ' + cfg.w + '×' + cfg.h + '%') : 'zona sin marcar') +
        (tok ? ' · tokens OK' : '') + '</small></button>';
    });
    zonasList.innerHTML = html;
    zonasList.querySelectorAll('[data-z]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.selected = btn.getAttribute('data-z');
        renderAll();
      });
    });
  }

  function renderRectEl(meta, layer, r, active) {
    if (!hasRect(r)) return null;
    var px = pctToPx(r);
    var el = document.createElement('div');
    el.className = (layer === 'tokens' ? 'tokens-rect' : 'zona-rect') + (active ? ' is-active' : '');
    el.style.setProperty('--c', meta.color);
    el.style.left = px.left + 'px';
    el.style.top = px.top + 'px';
    el.style.width = px.width + 'px';
    el.style.height = px.height + 'px';
    el.setAttribute('data-z', meta.id);
    el.setAttribute('data-layer', layer);
    el.innerHTML = '<span class="lbl">' + (layer === 'tokens' ? 'tokens' : meta.label) + '</span>';
    if (layer === 'zona' && state.showObras && meta.id === state.selected) {
      el.innerHTML += '<div class="obras-preview"><img src="' + OBRAS_URL + '" alt="EN OBRAS"/></div>';
    }
    if (active) appendHandles(el);
    return el;
  }

  function renderZones() {
    zonesLayer.innerHTML = '';
    ZONAS.forEach(function (meta) {
      var z = state.zonas[meta.id];
      if (!hasRect(z)) return;
      if (!state.showAll && meta.id !== state.selected) return;
      var activeZona = meta.id === state.selected && state.editLayer === 'zona';
      var activeTok = meta.id === state.selected && state.editLayer === 'tokens';
      var zonaEl = renderRectEl(meta, 'zona', z, activeZona);
      if (zonaEl) zonesLayer.appendChild(zonaEl);
      if (hasRect(z.tokens)) {
        var tokEl = renderRectEl(meta, 'tokens', z.tokens, activeTok);
        if (tokEl) zonesLayer.appendChild(tokEl);
      }
    });
  }

  function numRow(label, layer, key, val) {
    return '<div class="ctrl"><label>' + label + '</label>' +
      '<input type="number" step="0.01" min="0" max="100" data-layer="' + layer + '" data-k="' + key + '" value="' + val + '"/></div>';
  }

  function renderControls() {
    var meta = zonaMeta(state.selected);
    var z = state.zonas[state.selected];
    var layerLabel = state.editLayer === 'tokens' ? 'tokens / personajes' : 'zona clicable';
    document.getElementById('sel-title').textContent = meta.label + ' · ' + layerLabel;
    document.getElementById('sel-info').textContent = state.editLayer === 'tokens'
      ? 'Marca el rectángulo donde cabrán personajes sin salirse del lugar.'
      : (hasRect(z) ? 'Zona clicable marcada.' : 'Sin zona: arrastra en el mapa para dibujar.');
    document.getElementById('btn-layer-zona').classList.toggle('is-on', state.editLayer === 'zona');
    document.getElementById('btn-layer-tokens').classList.toggle('is-on', state.editLayer === 'tokens');

    var cur = state.editLayer === 'tokens' ? z.tokens : z;
    controlsEl.innerHTML =
      '<div class="section-title">Capa activa: ' + layerLabel + '</div>' +
      numRow('X (%)', state.editLayer, 'x', cur.x) +
      numRow('Y (%)', state.editLayer, 'y', cur.y) +
      numRow('Ancho (%)', state.editLayer, 'w', cur.w) +
      numRow('Alto (%)', state.editLayer, 'h', cur.h);

    if (hasRect(z)) {
      controlsEl.innerHTML += '<div class="section-title">Zona clicable</div>' +
        numRow('X', 'zona', 'x', z.x) + numRow('Y', 'zona', 'y', z.y) +
        numRow('Ancho', 'zona', 'w', z.w) + numRow('Alto', 'zona', 'h', z.h);
    }
    if (hasRect(z.tokens)) {
      controlsEl.innerHTML += '<div class="section-title">Tokens</div>' +
        numRow('X', 'tokens', 'x', z.tokens.x) + numRow('Y', 'tokens', 'y', z.tokens.y) +
        numRow('Ancho', 'tokens', 'w', z.tokens.w) + numRow('Alto', 'tokens', 'h', z.tokens.h);
    }

    controlsEl.querySelectorAll('input[data-k]').forEach(function (inp) {
      inp.addEventListener('change', function () {
        var patch = {};
        patch[inp.getAttribute('data-k')] = Number(inp.value);
        setLayerRect(state.selected, inp.getAttribute('data-layer'), patch);
      });
    });
  }

  function buildExport() {
    var out = {
      meta: {
        herramienta: 'dev/mapa-zonas-calibrador.html',
        mapa: 'assets/play-v3/mapa_canonico_v2.png',
        overlay_obras: 'assets/play-v3/overlay_en_obras.png',
        unidad: 'porcentaje',
        mapa_px: [MAP_W, MAP_H]
      },
      zonas: {}
    };
    ZONAS.forEach(function (meta) {
      var z = state.zonas[meta.id];
      var item = { x: z.x, y: z.y, w: z.w, h: z.h, label: meta.label };
      if (hasRect(z.tokens)) {
        item.tokens = { x: z.tokens.x, y: z.tokens.y, w: z.tokens.w, h: z.tokens.h };
      }
      out.zonas[meta.id] = item;
    });
    return out;
  }

  function updateExportPreview() { exportOut.value = JSON.stringify(buildExport(), null, 2); }

  function copyExport() {
    exportOut.select();
    navigator.clipboard.writeText(exportOut.value).then(function () {
      toast('JSON copiado');
    }).catch(function () { document.execCommand('copy'); toast('JSON copiado'); });
  }

  function downloadExport() {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([exportOut.value], { type: 'application/json' }));
    a.download = 'mapa_zonas.json';
    a.click();
    toast('Descarga iniciada');
  }

  function applyZoom() {
    stageWrap.style.transform = 'scale(' + state.zoom + ')';
    document.getElementById('zoom-label').textContent = Math.round(state.zoom * 100) + '%';
  }

  function clearDrawPreview() {
    if (drawPreview && drawPreview.parentNode) drawPreview.parentNode.removeChild(drawPreview);
    drawPreview = null;
  }

  function onPointerDown(ev) {
    if (ev.button !== 0) return;
    var t = ev.target;
    var handle = t.closest('[data-handle]');
    var rectEl = t.closest('[data-z]');
    var pt = stagePoint(ev);

    if (handle && rectEl) {
      interaction.mode = 'resize';
      interaction.layer = rectEl.getAttribute('data-layer');
      interaction.id = rectEl.getAttribute('data-z');
      interaction.handle = handle.getAttribute('data-handle');
      interaction.orig = Object.assign({}, getLayerRect(interaction.id, interaction.layer));
      ev.preventDefault();
      return;
    }
    if (rectEl) {
      interaction.mode = 'move';
      interaction.layer = rectEl.getAttribute('data-layer');
      interaction.id = rectEl.getAttribute('data-z');
      state.selected = interaction.id;
      state.editLayer = interaction.layer;
      interaction.sx = pt.x;
      interaction.sy = pt.y;
      interaction.orig = Object.assign({}, getLayerRect(interaction.id, interaction.layer));
      renderAll();
      ev.preventDefault();
      return;
    }
    if (t.closest('.stage') || t === stage || t.id === 'mapa-bg') {
      interaction.mode = 'draw';
      interaction.layer = state.editLayer;
      interaction.id = state.selected;
      interaction.start = { x: pt.x, y: pt.y };
      clearDrawPreview();
      drawPreview = document.createElement('div');
      drawPreview.className = 'draw-preview';
      if (state.editLayer === 'tokens') drawPreview.style.borderColor = '#6ec8ff';
      zonesLayer.appendChild(drawPreview);
      ev.preventDefault();
    }
  }

  function onPointerMove(ev) {
    var pt = stagePoint(ev);
    if (interaction.mode === 'draw' && drawPreview) {
      var x1 = Math.min(interaction.start.x, pt.x);
      var y1 = Math.min(interaction.start.y, pt.y);
      drawPreview.style.left = x1 + 'px';
      drawPreview.style.top = y1 + 'px';
      drawPreview.style.width = Math.abs(pt.x - interaction.start.x) + 'px';
      drawPreview.style.height = Math.abs(pt.y - interaction.start.y) + 'px';
      return;
    }
    if (!interaction.mode || !interaction.orig) return;
    var opx = pctToPx(interaction.orig);
    if (interaction.mode === 'move') {
      var dx = pt.x - interaction.sx;
      var dy = pt.y - interaction.sy;
      setLayerRect(interaction.id, interaction.layer, pxToPct(opx.left + dx, opx.top + dy, opx.width, opx.height));
      interaction.orig = Object.assign({}, getLayerRect(interaction.id, interaction.layer));
      interaction.sx = pt.x;
      interaction.sy = pt.y;
      return;
    }
    if (interaction.mode === 'resize') {
      var left = opx.left, top = opx.top, right = opx.left + opx.width, bottom = opx.top + opx.height;
      var h = interaction.handle;
      if (h.indexOf('w') >= 0) left = pt.x;
      if (h.indexOf('e') >= 0) right = pt.x;
      if (h.indexOf('n') >= 0) top = pt.y;
      if (h.indexOf('s') >= 0) bottom = pt.y;
      if (right - left < 4 || bottom - top < 4) return;
      setLayerRect(interaction.id, interaction.layer, pxToPct(left, top, right - left, bottom - top));
    }
  }

  function onPointerUp(ev) {
    if (interaction.mode === 'draw' && drawPreview) {
      var pt = stagePoint(ev);
      var x1 = Math.min(interaction.start.x, pt.x);
      var y1 = Math.min(interaction.start.y, pt.y);
      var w = Math.abs(pt.x - interaction.start.x);
      var h = Math.abs(pt.y - interaction.start.y);
      if (w >= 4 && h >= 4) {
        setLayerRect(interaction.id, interaction.layer, pxToPct(x1, y1, w, h));
        toast((interaction.layer === 'tokens' ? 'Tokens' : 'Zona') + ' marcados');
      }
      clearDrawPreview();
    }
    interaction.mode = null;
    interaction.layer = null;
    interaction.id = null;
    interaction.handle = null;
    interaction.orig = null;
  }

  function nudge(dx, dy) {
    var r = getLayerRect(state.selected, state.editLayer);
    if (!hasRect(r)) return;
    setLayerRect(state.selected, state.editLayer, { x: r.x + dx, y: r.y + dy });
  }

  function renderAll() {
    renderZonaButtons();
    renderZones();
    renderControls();
    updateExportPreview();
  }

  document.getElementById('mapa-bg').addEventListener('load', function () {
    MAP_W = this.naturalWidth || MAP_W;
    MAP_H = this.naturalHeight || MAP_H;
    stage.style.width = MAP_W + 'px';
    stage.style.height = MAP_H + 'px';
    updateExportPreview();
  });

  document.getElementById('btn-zoom-in').addEventListener('click', function () {
    state.zoom = Math.min(2, Math.round((state.zoom + 0.1) * 10) / 10);
    applyZoom();
  });
  document.getElementById('btn-zoom-out').addEventListener('click', function () {
    state.zoom = Math.max(0.35, Math.round((state.zoom - 0.1) * 10) / 10);
    applyZoom();
  });
  document.getElementById('btn-all-zones').addEventListener('click', function () {
    state.showAll = !state.showAll;
    this.classList.toggle('is-on', state.showAll);
    renderZones();
  });
  document.getElementById('btn-obras').addEventListener('click', function () {
    state.showObras = !state.showObras;
    this.classList.toggle('is-on', state.showObras);
    renderZones();
  });
  document.getElementById('btn-layer-zona').addEventListener('click', function () {
    state.editLayer = 'zona';
    renderAll();
  });
  document.getElementById('btn-layer-tokens').addEventListener('click', function () {
    state.editLayer = 'tokens';
    renderAll();
  });
  document.getElementById('btn-load-server').addEventListener('click', function () {
    loadServer().then(function () { renderAll(); });
  });
  document.getElementById('btn-export').addEventListener('click', updateExportPreview);
  document.getElementById('btn-copy').addEventListener('click', copyExport);
  document.getElementById('btn-download').addEventListener('click', downloadExport);
  document.getElementById('btn-clear-layer').addEventListener('click', function () {
    clearLayerRect(state.selected, state.editLayer);
    toast('Capa borrada');
  });
  document.getElementById('btn-nudge-up').addEventListener('click', function () { nudge(0, -0.5); });
  document.getElementById('btn-nudge-down').addEventListener('click', function () { nudge(0, 0.5); });
  document.getElementById('btn-nudge-left').addEventListener('click', function () { nudge(-0.5, 0); });
  document.getElementById('btn-nudge-right').addEventListener('click', function () { nudge(0.5, 0); });

  stage.addEventListener('mousedown', onPointerDown);
  window.addEventListener('mousemove', onPointerMove);
  window.addEventListener('mouseup', onPointerUp);

  loadLocal();
  renderAll();
  applyZoom();
})();
</script>
</body>
</html>
