<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>AHT — Sticker Composer (temporal)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;background:#1a1714;color:#f5f0e8}

#app{display:grid;grid-template-rows:42px 1fr;grid-template-columns:210px minmax(0,1fr);height:100vh}
#toolbar{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:0 12px;background:#2c261f;border-bottom:2px solid #4a3f32;z-index:200}
#palette{grid-row:2;overflow-y:auto;padding:8px;background:#231f1a;border-right:1px solid #3a3228}
#viewport{grid-row:2;position:relative;background:#e8e3da;overflow:auto}
.mode-mobile #viewport{display:flex;justify-content:center;align-items:flex-start}

#toolbar h1{font-size:13px;font-weight:700;color:#e8dcc4;white-space:nowrap}
.sep{width:1px;height:22px;background:#4a3f32;flex-shrink:0}
#toolbar button{font:12px/1 'Segoe UI',system-ui,sans-serif;border:1px solid #5a4f42;border-radius:5px;padding:4px 10px;background:#3a3228;color:#e8dcc4;cursor:pointer;white-space:nowrap}
#toolbar button:hover{background:#4a3f32}
#toolbar button.active{background:#6b8f5e;border-color:#6b8f5e}
#toolbar .protect-btn.active{background:#d4a843;border-color:#d4a843;color:#1a1714}
#toolbar .export-btn{background:#4a7fb5;border-color:#4a7fb5;color:#fff;font-weight:700}
#toolbar .clear-btn{background:#8b4545;border-color:#8b4545;color:#fff}
#toolbar .spacer{flex:1}
#toolbar .hint{font-size:10px;color:#7a6e5e}

.cat-sec{font-size:10px;text-transform:uppercase;color:#a89878;letter-spacing:.5px;margin:10px 0 4px;padding-left:3px;font-weight:700}
.sticker-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:6px}
.sticker-opt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;border:1px solid transparent;border-radius:5px;cursor:pointer;transition:border-color .12s}
.sticker-opt:hover{border-color:#6b8f5e;background:#2a2520}
.sticker-opt.sel{border-color:#c45b72;background:#3a2530}
.sticker-opt svg{width:28px;height:28px;flex-shrink:0}
.sticker-opt .lbl{font-size:8px;color:#8a7e6e;text-align:center;line-height:1.1}
.phelp{font-size:10px;color:#7a6e5e;padding:6px;line-height:1.35}
#placed-list .pitem{display:flex;align-items:center;gap:4px;padding:3px 5px;margin-bottom:2px;border-radius:3px;background:#2a2520;font-size:10px;color:#c4b89a}
#placed-list .pitem button{font-size:9px;padding:1px 5px;border-radius:3px;border:1px solid #5a4f42;cursor:pointer}
#placed-list .pitem .dup{background:#4a3f32;color:#e8dcc4}
#placed-list .pitem .del{background:#6b3535;color:#e8dcc4}
#placed-list .pitem .ico{width:14px;height:14px;flex-shrink:0}

#iframe-wrap{position:relative;flex-shrink:0;transition:width .2s}
.mode-desktop #iframe-wrap{width:100%}
.mode-mobile #iframe-wrap{width:390px}
#game-frame{display:block;border:none;background:#fff}
.mode-desktop #game-frame{width:100%;height:900px}
.mode-mobile #game-frame{width:390px;height:844px}

/* visual scale wrapper */
#scale-wrap{position:relative;max-height:100%;padding:10px}
.mode-desktop #scale-wrap{overflow-x:auto;overflow-y:auto}
.mode-mobile #scale-wrap{overflow:visible;display:flex;justify-content:center}

/* JSON modal */
#json-modal{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.7);align-items:center;justify-content:center}
#json-modal.show{display:flex}
#json-modal-inner{background:#2c261f;border:2px solid #5a4f42;border-radius:10px;padding:20px;max-width:600px;width:90%;max-height:80vh;display:flex;flex-direction:column;gap:12px}
#json-modal h2{font-size:15px;color:#e8dcc4}
#json-modal textarea{flex:1;min-height:200px;background:#1a1714;color:#e8dcc4;border:1px solid #4a3f32;border-radius:6px;padding:10px;font:12px/1.4 monospace;resize:vertical}
#json-modal .mbtns{display:flex;gap:8px;justify-content:flex-end}
#json-modal button{padding:6px 16px;border-radius:5px;border:1px solid #5a4f42;cursor:pointer;font:inherit}
.btn-copy{background:#4a7fb5;color:#fff;border-color:#4a7fb5}
.btn-close{background:#3a3228;color:#e8dcc4}
</style>
</head>
<body class="mode-desktop">
<div id="app">
  <header id="toolbar">
    <h1>Sticker Composer</h1>
    <div class="sep"></div>
    <button class="mode-btn active" data-mode="desktop">Desktop</button>
    <button class="mode-btn" data-mode="mobile">Movil 390px</button>
    <div class="sep"></div>
    <button class="protect-btn" data-toggle="protected">Zonas protegidas</button>
    <div class="sep"></div>
    <span class="hint" id="status-hint">Esperando juego...</span>
    <div class="spacer"></div>
    <button class="export-btn" data-act="export">COPIAR CONFIGURACION</button>
    <button class="clear-btn" data-act="clear">Limpiar</button>
  </header>
  <aside id="palette">
    <div id="sticker-list"></div>
    <div class="cat-sec" style="margin-top:10px">Colocados</div>
    <div id="placed-list"><div class="phelp">Ninguno</div></div>
  </aside>
  <main id="viewport">
    <div id="scale-wrap">
      <div id="iframe-wrap">
        <iframe id="game-frame" src="../play.php?composer=1"></iframe>
      </div>
    </div>
  </main>
</div>

<div id="json-modal">
  <div id="json-modal-inner">
    <h2>Configuracion de stickers</h2>
    <textarea id="json-output" readonly></textarea>
    <div class="mbtns">
      <button class="btn-close" data-act="close-modal">Cerrar</button>
      <button class="btn-copy" data-act="copy-json">Copiar al portapapeles</button>
    </div>
  </div>
</div>

};

var CAT_ORDER=[
  {key:'nat',label:'Naturaleza',items:['sun','moon','cloud','rainbow','leaf','sunflower']},
  {key:'doo',label:'Doodles',items:['spiral','star','sparkle','bolt','thought']},
  {key:'obj',label:'Objetos',items:['house','coffee','envelope','balloon']},
  {key:'dec',label:'Decoracion',items:['heart','flower','butterfly','music','bird']}
];

/* ═══════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════ */
var S={sel:null,placed:[],prot:false,nid:1,ready:false,queue:[]};
var frame=document.getElementById('game-frame');
var wrap=document.getElementById('iframe-wrap');
var hint=document.getElementById('status-hint');

/* ═══════════════════════════════════════════════════
   PALETTE
   ═══════════════════════════════════════════════════ */
var sl=document.getElementById('sticker-list');
CAT_ORDER.forEach(function(sec){
  var secEl=document.createElement('div');
  secEl.className='cat-sec';
  secEl.textContent=sec.label;
  var grid=document.createElement('div');
  grid.className='sticker-grid';
  sec.items.forEach(function(k){
    var c=CAT[k];if(!c)return;
    var d=document.createElement('div');
    d.className='sticker-opt';d.dataset.k=k;
    d.innerHTML=c.s+'<span class="lbl">'+c.n+'</span>';
    d.addEventListener('click',function(){
      sl.querySelectorAll('.sel').forEach(function(x){x.classList.remove('sel')});
      d.classList.add('sel');S.sel=k;
      sendCmd({type:'aht-place-mode',on:!!S.sel});
      hint.textContent=S.sel?'Click en el juego para colocar '+c.n:'Selecciona un sticker';
    });
    grid.appendChild(d);
  });
  secEl.appendChild(grid);
  sl.appendChild(secEl);
});

/* ═══════════════════════════════════════════════════
   IFRAME COMMUNICATION
   ═══════════════════════════════════════════════════ */
function sendCmd(obj){
  if(S.ready){frame.contentWindow.postMessage(obj,'*');}
  else{S.queue.push(obj);}
}
function flushQueue(){
  while(S.queue.length){frame.contentWindow.postMessage(S.queue.shift(),'*');}
}

window.addEventListener('message',function(ev){
  var d=ev.data;if(!d||!d.type)return;
  if(d.type==='aht-ready'){
    S.ready=true;flushQueue();
    hint.textContent='Listo — selecciona un sticker';
    syncAllStickers();
    return;
  }
  if(d.type==='aht-click'){
    if(!S.sel)return;
    var id='stk_'+(S.nid++);
    sendCmd({type:'aht-add-sticker',id:id,sticker:S.sel,x:d.x,y:d.y,width:44,rotation:0});
    S.placed.push({id:id,k:S.sel,x:Math.round(d.x),y:Math.round(d.y),w:44,r:0});
    updList();
    return;
  }
  if(d.type==='aht-sticker-moved'){
    var s=S.placed.find(function(p){return p.id===d.id;});
    if(s){s.x=Math.round(d.x);s.y=Math.round(d.y);s.w=Math.round(d.width);s.r=Math.round(d.rotation);}
    return;
  }
});

function syncAllStickers(){
  S.placed.forEach(function(s){
    sendCmd({type:'aht-add-sticker',id:s.id,sticker:s.k,x:s.x,y:s.y,width:s.w,rotation:s.r});
  });
}

/* Pass sticker SVG catalog to iframe */
function passCatalog(){
  try{frame.contentWindow.AHT_STICKER_SVGS={};}catch(e){return false;}
  Object.keys(CAT).forEach(function(k){
    try{frame.contentWindow.AHT_STICKER_SVGS[k]=CAT[k].s;}catch(e){}
  });
  return true;
}

frame.addEventListener('load',function(){
  S.ready=false;hint.textContent='Cargando juego...';
  if(!passCatalog()){setTimeout(passCatalog,300);}
});

/* ═══════════════════════════════════════════════════
   MODE SWITCH
   ═══════════════════════════════════════════════════ */
document.querySelectorAll('.mode-btn').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.mode-btn').forEach(function(x){x.classList.remove('active')});
    b.classList.add('active');
    document.body.className='mode-'+b.dataset.mode;
    var isMobile=b.dataset.mode==='mobile';
    frame.src='../play.php?composer=1';
    S.ready=false;hint.textContent='Cargando juego...';
  });
});

/* ═══════════════════════════════════════════════════
   PLACED LIST
   ═══════════════════════════════════════════════════ */
function updList(){
  var pl=document.getElementById('placed-list');pl.innerHTML='';
  if(!S.placed.length){pl.innerHTML='<div class="phelp">Ninguno</div>';return;}
  S.placed.forEach(function(s){
    var r=document.createElement('div');r.className='pitem';
    var c=CAT[s.k];
    r.innerHTML='<span class="ico">'+(c?c.s:'')+'</span>'+
      '<span style="flex:1">'+(c?c.n:s.k)+' ('+s.x+','+s.y+')</span>'+
      '<button class="dup" data-d="'+s.id+'">Dup</button> '+
      '<button class="del" data-x="'+s.id+'">X</button>';
    pl.appendChild(r);
  });
  pl.querySelectorAll('.dup').forEach(function(b){b.onclick=function(){
    var o=S.placed.find(function(x){return x.id===b.dataset.d;});
    if(!o)return;
    var id='stk_'+(S.nid++);
    var nx=o.x+15,ny=o.y+15;
    sendCmd({type:'aht-add-sticker',id:id,sticker:o.k,x:nx,y:ny,width:o.w,rotation:o.r});
    S.placed.push({id:id,k:o.k,x:Math.round(nx),y:Math.round(ny),w:o.w,r:o.r});
    updList();
  };});
  pl.querySelectorAll('.del').forEach(function(b){b.onclick=function(){
    sendCmd({type:'aht-remove-sticker',id:b.dataset.x});
    S.placed=S.placed.filter(function(s){return s.id!==b.dataset.x;});
    updList();
  };});
}

/* ═══════════════════════════════════════════════════
   PROTECTED ZONES
   ═══════════════════════════════════════════════════ */
document.querySelector('.protect-btn').addEventListener('click',function(){
  S.prot=!S.prot;this.classList.toggle('active',S.prot);
  sendCmd({type:'aht-prot-zones',show:S.prot});
});

/* ═══════════════════════════════════════════════════
   EXPORT
   ═══════════════════════════════════════════════════ */
document.querySelector('[data-act="export"]').addEventListener('click',function(){
  var out={desktop:[],mobile:[]};
  S.placed.forEach(function(s){
    var item={id:s.id,sticker:s.k,x:s.x,y:s.y,width:s.w,rotation:s.r};
    if(document.body.classList.contains('mode-desktop'))out.desktop.push(item);
    else out.mobile.push(item);
  });
  document.getElementById('json-output').value=JSON.stringify(out,null,2);
  document.getElementById('json-modal').classList.add('show');
});
document.querySelector('[data-act="clear"]').addEventListener('click',function(){
  if(!confirm('Limpiar stickers?'))return;
  S.placed.forEach(function(s){sendCmd({type:'aht-remove-sticker',id:s.id});});
  S.placed=[];updList();
});
document.querySelector('[data-act="close-modal"]').onclick=function(){document.getElementById('json-modal').classList.remove('show')};
document.querySelector('[data-act="copy-json"]').onclick=function(){
  var ta=document.getElementById('json-output');ta.select();
  if(navigator.clipboard)navigator.clipboard.writeText(ta.value).then(function(){alert('Copiado!')});
  else{document.execCommand('copy');alert('Copiado!');}
};
document.getElementById('json-modal').onclick=function(e){if(e.target===this)this.classList.remove('show')};

})();
</script>
</body>
</html>
